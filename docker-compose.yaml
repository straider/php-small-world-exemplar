version: "3.9"

services:
  php:
    image: php:8.2-apache
    container_name: php-server
    ports:
      - "8080:80"               # Host port : Container port
    volumes:
      - ./src/php:/var/www/html   # Mount your PHP code
    ports:
      - "8080:80"             # Host port : Container port
    depends_on:
      - db
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"

  db:
    image: mysql:8.1.0          # Smallest image
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: demo
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8888:80"
    environment:
      PMA_HOST: db
      PMA_USER: appuser
      PMA_PASSWORD: apppass
    depends_on:
      - db

volumes:
  db_data:
