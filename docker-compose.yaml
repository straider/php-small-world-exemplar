version: "3.9"

services:
  php:
    image: php:8.2-fpm
    container_name: php-fpm
    volumes:
      - ./src/php:/var/www/html

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./src/php:/var/www/html
      - ./configuration/nginx.conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
